<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>疗效观察卡 · 9/1 内分泌方</title>
<style>
  :root{ --green:#7fb069; --ink:#4a4a4a; --bg:#faf7f0; --card:#ffffff; --line:#e8e0d0; }
  *{ box-sizing:border-box; }
  body{ font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); max-width:780px; margin:auto; padding:18px 16px 60px; line-height:1.6; }
  h1{ font-size:22px; margin:6px 0; }
  .sub{ color:#8a8270; font-size:13px; margin-bottom:10px; }
  .card{ background:var(--card); border-radius:16px; padding:16px 18px; box-shadow:0 2px 10px rgba(0,0,0,.05); margin:14px 0; }
  .card h3{ margin:0 0 12px; font-size:16px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  label{ font-weight:600; font-size:14px; }
  input,select,textarea{ font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:#fffdf8; color:var(--ink); }
  textarea{ flex:1; min-width:200px; resize:vertical; }
  input[type=range]{ flex:1; min-width:160px; }
  button{ background:var(--green); color:#fff; border:none; border-radius:10px; padding:11px 18px; font-size:15px; cursor:pointer; font-weight:600; }
  button:hover{ filter:brightness(1.05); }
  .small{ font-size:12px; color:#8a8270; }
  .tag{ display:inline-block; background:#f0ead9; border-radius:8px; padding:3px 9px; margin:3px 4px 3px 0; font-size:13px; }
  .tag.on{ background:var(--green); color:#fff; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; }
  th{ color:#8a8270; font-weight:600; }
  svg{ width:100%; height:170px; }
  .legend{ font-size:12px; color:#8a8270; margin-top:4px; }
</style>
</head>
<body>
  <h1>🌿 疗效观察卡</h1>
  <div class="sub">9/1 龙华内分泌科草药方（12 付）· 自 <b>2026-09-08</b> 起服 · 共 12 天（至 09-19）</div>

  <div class="card">
    <h3>📝 今日记录</h3>
    <div class="row"><label>日期</label><select id="date"></select><span class="small" id="dayidx"></span></div>
    <div class="row">
      <label>多梦程度</label>
      <input type="range" id="dream" min="0" max="10" value="5">
      <span id="dreamv" style="font-weight:700;min-width:18px">5</span>
      <span class="small">0=整夜安睡无梦 · 10=整夜梦魇</span>
    </div>
    <div class="row">
      <label>白天脸红</label><input type="checkbox" id="faceDay">
      <label>遇热脸红</label><input type="checkbox" id="faceHeat">
    </div>
    <div class="row">
      <label>入睡时间</label>
      <select id="sleep"><option>21点前</option><option>21-22点</option><option>22-23点</option><option>23-24点</option><option>0点后</option></select>
      <label>夜醒次数</label>
      <select id="wake"><option>0</option><option>1</option><option>2</option><option>3次以上</option></select>
    </div>
    <div class="row"><label>体重(kg)</label><input id="weight" type="number" step="0.1" placeholder="可选，留空不记"></div>
    <div class="row"><label>备注</label><textarea id="note" rows="2" placeholder="口感/不适/心情/其它…"></textarea></div>
    <div class="row"><button onclick="save()">💾 保存今日</button><span class="small" id="msg"></span></div>
  </div>

  <div class="card">
    <h3>📈 多梦程度趋势</h3>
    <svg id="chart" viewBox="0 0 720 170" preserveAspectRatio="none"></svg>
    <div class="legend">折线越低 = 睡得越好（多梦分 0 最佳）。只显示已记录的天。</div>
  </div>

  <div class="card">
    <h3>📋 已记录</h3>
    <div id="list"></div>
  </div>

<script>
const START='2026-09-08', DAYS=12;
let recs=JSON.parse(localStorage.getItem('obs_recs')||'{}');
const $=id=>document.getElementById(id);
function iso(d){ return d.toISOString().slice(0,10); }
function initDates(){
  const sel=$('date');
  for(let i=0;i<DAYS;i++){
    const dt=new Date(START+'T00:00:00'); dt.setDate(dt.getDate()+i);
    const v=iso(dt); const o=document.createElement('option'); o.value=v;
    o.text=v.slice(5)+(i===0?'（第1天）':i===DAYS-1?'（第12天）':'');
    sel.appendChild(o);
  }
  sel.value=iso(new Date());
  $('dayidx').textContent='· 共 '+DAYS+' 天';
  $('dream').oninput=()=>$('dreamv').textContent=$('dream').value;
}
function save(){
  const d=$('date').value;
  recs[d]={
    dream:+$('dream').value,
    faceDay:$('faceDay').checked,
    faceHeat:$('faceHeat').checked,
    sleep:$('sleep').value,
    wake:$('wake').value,
    weight:$('weight').value?+$('weight').value:null,
    note:$('note').value
  };
  localStorage.setItem('obs_recs',JSON.stringify(recs));
  $('msg').textContent='已保存 '+d+' ✓';
  render();
}
function render(){
  // chart
  const keys=Object.keys(recs).sort();
  const svg=$('chart'); svg.innerHTML='';
  const W=720,H=170,pad=24;
  // grid lines
  for(let s=0;s<=10;s+=2){
    const y=pad+(H-2*pad)*(s/10);
    svg.innerHTML+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#eee" />`;
    svg.innerHTML+=`<text x="2" y="${y+4}" font-size="10" fill="#aaa">${s}</text>`;
  }
  if(keys.length){
    const n=keys.length;
    const X=i=> n===1?W/2 : pad+(W-2*pad)*(i/(n-1));
    const Y=v=> pad+(H-2*pad)*(v/10);
    let pts='';
    keys.forEach((k,i)=>{ pts+=`${X(i)},${Y(recs[k].dream)} `; });
    svg.innerHTML+=`<polyline points="${pts}" fill="none" stroke="#7fb069" stroke-width="2.5"/>`;
    keys.forEach((k,i)=>{
      svg.innerHTML+=`<circle cx="${X(i)}" cy="${Y(recs[k].dream)}" r="4" fill="#7fb069"/>`;
      svg.innerHTML+=`<text x="${X(i)}" y="${H-4}" font-size="9" fill="#8a8270" text-anchor="middle">${k.slice(5)}</text>`;
    });
  } else {
    svg.innerHTML+=`<text x="${W/2}" y="${H/2}" font-size="13" fill="#bbb" text-anchor="middle">还没有记录，保存第一天后这里出图</text>`;
  }
  // list
  let html='<table><tr><th>日期</th><th>多梦</th><th>脸红</th><th>睡眠</th><th>体重</th><th>备注</th></tr>';
  if(!keys.length) html+='<tr><td colspan="6" class="small">暂无</td></tr>';
  keys.forEach(k=>{
    const r=recs[k];
    const face=(r.faceDay?'白天':'')+(r.faceHeat?'+遇热':'');
    html+=`<tr><td>${k.slice(5)}</td><td>${r.dream}</td><td>${face||'—'}</td><td>${r.sleep}/醒${r.wake}</td><td>${r.weight??'—'}</td><td>${r.note||''}</td></tr>`;
  });
  html+='</table>';
  $('list').innerHTML=html;
}
initDates(); render();
</script>
</body>
</html>
