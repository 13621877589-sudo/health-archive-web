<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>检验报告档案 · 身体成分 + 化验</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fef9f3 0%,#f5e8d8 100%);color:#3a2e26;min-height:100vh;padding:24px 16px}
.wrap{max-width:820px;margin:0 auto;background:#fffbf5;border-radius:16px;box-shadow:0 8px 30px rgba(120,80,40,.12);padding:28px 30px 40px}
h1{font-size:20px;color:#7a4a2a;letter-spacing:1px;margin-bottom:4px}
.sub{color:#a07a5a;font-size:12px;margin-bottom:18px}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid #f0e1c8}
.tab{padding:8px 16px;cursor:pointer;border-radius:8px 8px 0 0;font-size:13px;color:#7a5a3a;background:transparent;border:none;font-weight:500}
.tab.active{background:#f7e6cd;color:#7a4a2a;font-weight:700}
.panel{display:none}
.panel.active{display:block}
.login{text-align:center;padding:30px 10px}
.login h2{font-size:17px;color:#7a4a2a;margin-bottom:14px}
.login input{display:block;width:100%;max-width:320px;margin:8px auto;padding:10px 14px;border:1px solid #d4b896;border-radius:8px;font-size:14px;background:#fff}
.login button{margin-top:14px;padding:10px 28px;background:#c98a55;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.login button:disabled{background:#d4b896;cursor:not-allowed}
.err{color:#c0392b;font-size:12px;margin-top:8px}
.meta{background:#fff5e6;padding:12px 16px;border-radius:10px;font-size:12px;line-height:1.7;color:#5a4030;margin-bottom:18px}
.meta b{color:#7a4a2a}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;margin-bottom:14px}
th{background:#f7e6cd;color:#5a3820;padding:7px 9px;text-align:left;border-bottom:1.5px solid #d4b896;font-weight:600}
td{padding:6px 9px;border-bottom:1px solid #f0e1c8}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:monospace}
.ref{color:#9a7855;font-size:11px}
.abn{color:#fff;background:#c0392b;font-weight:700;padding:1px 5px;border-radius:3px;font-size:11px}
.abn-row td{background:#fff8f5}
.panel-title{margin:18px 0 8px;padding-left:8px;border-left:4px solid #c98a55;font-size:14px;color:#7a4a2a;font-weight:700}
.summary{background:#faf3e6;border:1px dashed #c98a55;border-radius:8px;padding:12px 16px;margin:12px 0;font-size:12px;line-height:1.8;color:#5a3820}
.summary b{color:#7a4a2a}
.summary ol{padding-left:22px;margin-top:4px}
.tip{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12px;color:#2e5d2e;line-height:1.7}
.tip::before{content:"✓";font-weight:700;margin-right:4px}
.warn{background:#fff3e0;border:1px solid #ffcc99;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12px;color:#7a4010;line-height:1.7}
.warn::before{content:"⚠";margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 检验报告档案</h1>
  <div class="sub">云端加密数据 · 实时同步 · 端到端仅你可解</div>

  <div id="loginBox" class="login">
    <h2>登录查看</h2>
    <input id="tok" type="password" placeholder="GitHub Token" autocomplete="off">
    <input id="pwd" type="password" placeholder="数据解密口令" autocomplete="off">
    <button id="btn">解锁</button>
    <div id="err" class="err"></div>
  </div>

  <div id="content" style="display:none">
    <div class="tabs">
      <button class="tab active" data-tab="lab1">8/30 验血报告</button>
      <button class="tab" data-tab="trend">趋势</button>
    </div>

    <div id="panel-lab1" class="panel active"></div>
    <div id="panel-trend" class="panel">
      <div class="tip">趋势功能下次迭代上线（目前只有 1 次验血，需要累积数据点）。</div>
    </div>
  </div>
</div>

<script>
const REPO_USER='13621877589-sudo';
const REPO='health-archive-data';
const FILE='data.json';
const SALT_LEN=16,IV_LEN=12,ITER=210000,HASH='sha256';

async function api(path,token){
  const r=await fetch('https://api.github.com/repos/'+REPO_USER+'/'+REPO+'/contents/'+path+'?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}});
  if(!r.ok) throw new Error('API '+r.status+': '+await r.text());
  return r.json();
}

function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unb64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer}

async function getKey(pass,salt){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:HASH},km,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);
}

async function decryptData(raw,pass){
  const salt=new Uint8Array(unb64(raw.salt));
  const iv=new Uint8Array(unb64(raw.iv));
  const ctBuf=unb64(raw.ct);
  const ct=new Uint8Array(ctBuf);
  const tag=ct.slice(-16);
  const data=ct.slice(0,-16);
  const key=await getKey(pass,salt);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128,additionalData:new Uint8Array()},key,data);
  return JSON.parse(new TextDecoder().decode(plain));
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c])}
function num(v){return v==null?'-':v}
function fmtRef(r){if(!r)return '-';let s='';if(r.low!=null)s+=r.low;if(r.low!=null||r.high!=null)s+=' ~ ';if(r.high!=null)s+=r.high;if(r.条件)s+=' ('+r.条件+')';return s}

function renderItem(it){
  const abn=it.异常===true?`<span class="abn">${esc(it.方向||'异常')}</span>`:it.异常===false?'<span style="color:#5d8a5d">✓</span>':'<span style="color:#b8860b">需判断</span>';
  return `<tr class="${it.异常?'abn-row':''}"><td>${esc(it.项目||'-')}</td><td class="num">${num(it.值)}</td><td>${esc(it.单位||'')}</td><td class="num ref">${esc(fmtRef(it.参考))}</td><td>${abn}${it.提示?'<div style="font-size:10px;color:#7a5a3a;margin-top:2px">'+esc(it.提示)+'</div>':''}</td></tr>`;
}

function renderPanel(name,items){
  let html=`<div class="panel-title">${esc(name)}（${items.length} 项）</div><table><thead><tr><th>项目</th><th class="num">结果</th><th>单位</th><th class="num">参考</th><th>状态</th></tr></thead><tbody>`;
  if(Array.isArray(items)) items.forEach(it=>html+=renderItem(it));
  else for(const k in items) html+=renderItem({项目:k,...items[k]});
  html+='</tbody></table>';
  return html;
}

function renderLab(lab){
  const p=lab.panels||{};
  const abnCount=lab.异常汇总?.length||0;
  let html=`
    <div class="meta">
      <div><b>日期：</b>${esc(lab.日期)} &nbsp; <b>医院：</b>${esc(lab.医院)}</div>
      <div><b>科室：</b>${esc(lab.科室)} &nbsp; <b>报告姓名：</b>${esc(lab.报告姓名||'-')}</div>
      <div><b>采样：</b>${esc(lab.采样时间||'-')} &nbsp; <b>报告时间：</b>${esc(lab.报告时间||'-')}</div>
      <div><b>检查医生：</b>${esc((lab.检查医生||[]).join(' / '))}</div>
    </div>
    <div class="summary">
      <b>📊 异常项汇总（${abnCount} 项）：</b>
      <ol>${(lab.异常汇总||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    </div>
  `;
  if(p.生化) html+=renderPanel('一、生化（糖化血红蛋白）',p.生化);
  if(p.免疫激素) html+=renderPanel('二、免疫 / 激素',p.免疫激素);
  if(p.肝肾电解) html+=renderPanel('三、肝肾功能 + 血脂 + 电解质',p.肝肾电解);
  if(p.血常规) html+=renderPanel('四、血常规',p.血常规);

  if(lab.解读){
    html+=`<div class="tip" style="background:#f0f8ff;border-color:#a5c9e6;color:#2c5d80"><b>🔍 解读：</b><ol style="padding-left:22px;margin-top:4px">${lab.解读.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`;
  }
  if(lab.建议下次问医生){
    html+=`<div class="warn"><div><b>下次问医生：</b><ol style="padding-left:22px;margin-top:4px">${lab.建议下次问医生.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></div>`;
  }
  return html;
}

function showContent(data){
  const labs=data.labs||[];
  document.getElementById('loginBox').style.display='none';
  document.getElementById('content').style.display='block';
  const panel=document.getElementById('panel-lab1');
  if(labs.length===0){panel.innerHTML='<div class="warn">暂无检验报告</div>';return;}
  panel.innerHTML=labs.map(renderLab).join('<hr style="margin:24px 0;border:none;border-top:1px dashed #d4b896">');
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  };
});

document.getElementById('btn').onclick=async()=>{
  const tok=document.getElementById('tok').value.trim();
  const pwd=document.getElementById('pwd').value;
  const err=document.getElementById('err');
  const btn=document.getElementById('btn');
  err.textContent='';
  if(!tok||!pwd){err.textContent='请填写 Token 和口令';return;}
  btn.disabled=true;btn.textContent='解锁中…';
  try{
    const meta=await api(FILE,tok);
    const raw=JSON.parse(atob(meta.content));
    const data=await decryptData(raw,pwd);
    showContent(data);
  }catch(e){err.textContent='失败：'+e.message;btn.disabled=false;btn.textContent='解锁';}
};
</script>
</body>
</html>
